name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Test and install Commons Imaging
      run: mvn -B clean install jacoco:report

    - name: Test backend and generate coverage
      run: mvn -B -f backend/pom.xml verify

    - name: Upload JaCoCo reports
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-reports
        path: |
          target/site/jacoco/
          backend/target/site/jacoco/
        retention-days: 30
