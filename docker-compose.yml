services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: imaging
      POSTGRES_USER: imaging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define the POSTGRES_PASSWORD in .env file.}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imaging -d imaging"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/imaging
      DB_USERNAME: imaging
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - image_data:/data/images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: on-failure

volumes:
  db_data:
  image_data:
