spring:
  application:
    name: imaging-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage-dir: ${STORAGE_DIR:/data/images}

management:
  endpoint:
    health:
      show-details: never
