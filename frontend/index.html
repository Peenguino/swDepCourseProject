<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commons Imaging Gallery</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Commons Imaging Gallery</h1>
    <p>Carica e cataloga immagini oppure convertile in PNG.</p>

    <form id="upload-form">
      <label>Immagine <input type="file" name="file" accept="image/*" required></label>
      <label>Titolo <input name="title" maxlength="120" required></label>
      <label>Descrizione <textarea name="description" maxlength="1000"></textarea></label>
      <button type="submit">Carica</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section>
      <h2>Catalogo</h2>
      <div id="images"></div>
    </section>
  </main>
</body>
</html>
